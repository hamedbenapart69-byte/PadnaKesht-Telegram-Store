name: Padnakasht Storefront Quality Gates

on:
  push:
    branches: [website-storefront]
    paths:
      - "website/**"
      - ".github/workflows/website-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: |
          node --check website/src/index.js
          node --check website/public/app.js
          node --check website/public/admin.js
      - name: Check storefront contracts
        run: node website/scripts/check.mjs
      - name: Type-check Supabase Edge Function
        run: deno check website/supabase/functions/store-api/index.ts
      - name: Validate Wrangler build
        working-directory: website
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/padnakasht-worker
