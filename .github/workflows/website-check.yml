name: Padnakasht Storefront Quality Gates

on:
  push:
    branches: [website-storefront, website-release]
    paths:
      - "website/**"
      - ".github/workflows/website-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Build, type and deployment validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: |
          node --check website/public/app.js
          node --check website/public/admin.js
      - name: Check storefront contracts
        run: node website/scripts/check.mjs
      - name: Type-check Supabase Edge Function
        working-directory: website/supabase/functions/store-api
        run: deno check --node-modules-dir=auto index.ts
      - name: Verify embedded static assets match source files
        run: node website/scripts/check.mjs

  independent-reviewers:
    name: Reviewer / ${{ matrix.reviewer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        reviewer:
          - architecture
          - security
          - database
          - orders
          - inventory
          - accessibility
          - responsive
          - images
          - performance
          - deployment
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run independent review
        run: node website/scripts/review.mjs ${{ matrix.reviewer }}

  publish-verified-release:
    name: Publish branch only after all gates pass
    needs: [validate, independent-reviewers]
    concurrency:
      group: website-release-publish
      cancel-in-progress: false
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified release branch
        run: |
          git fetch origin website-release || true
          if git show-ref --verify --quiet refs/remotes/origin/website-release; then
            if git merge-base --is-ancestor origin/website-release HEAD; then
              git push origin HEAD:refs/heads/website-release
            elif git merge-base --is-ancestor HEAD origin/website-release; then
              echo "Skipping stale run; verified release branch is already ahead."
            else
              echo "Release branch diverged from this validated commit."
              exit 1
            fi
          else
            git push origin HEAD:refs/heads/website-release
          fi
